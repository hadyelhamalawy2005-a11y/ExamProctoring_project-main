name: examora_app
description: "Examora - the Flutter mobile app of an AI-based exam proctoring system (graduation project). Runs standalone on local storage and is wired for a future API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # Needed so Material widgets (date pickers, text selection menus, ...) speak Arabic and lay out right-to-left.
  # It ships with the Flutter SDK; it is not a third-party package.
  flutter_localizations:
    sdk: flutter

  # --- Packages listed by the specification (see FRONTEND_BUILD_PROMPT.md) ---
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  http: ^1.6.0
  file_picker: ^13.3.0
  archive: ^4.5.2
  xml: ^7.1.0
  camera: ^0.12.1
  permission_handler: ^13.0.2
  connectivity_plus: ^7.3.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  intl: ^0.20.3
  collection: ^1.19.1
  meta: ^1.19.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/templates/examora_question_template.docx
